            type: boolean
        - name: country
          in: query
          schema:
            $ref: '#/components/schemas/Country'
        - name: language
          in: query
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: List of news sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NewsSource'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                  pages:
                    type: integer
    post:
      tags:
        - News Sources
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsSourceCreate'
      responses:
        '201':
          description: News source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSource'

  /news-sources/{source_id}:
    parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - News Sources
      security:
        - BearerAuth: []
      responses:
        '200':
          description: News source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSource'
    patch:
      tags:
        - News Sources
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsSourceBase'
      responses:
        '200':
          description: News source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSource'
    delete:
      tags:
        - News Sources
      security:
        - BearerAuth: []
      responses:
        '204':
          description: News source deleted

  /news:
    get:
      tags:
        - News
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NewsStatus'
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
        - name: country
          in: query
          schema:
            $ref: '#/components/schemas/Country'
        - name: language
          in: query
          schema:
            $ref: '#/components/schemas/Language'
        - name: is_direct_mention
          in: query
          schema:
            type: boolean
        - name: min_score
          in: query
          schema:
            type: number
        - name: max_score
          in: query
          schema:
            type: number
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: search_query
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of news items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItemListResponse'
    post:
      tags:
        - News
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsItemCreate'
      responses:
        '201':
          description: News item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'

  /news/{news_id}:
    parameters:
      - name: news_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - News
      security:
        - BearerAuth: []
      responses:
        '200':
          description: News item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItemWithSource'
    patch:
      tags:
        - News
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content_summary:
                  type: string
                full_content:
                  type: string
                status:
                  $ref: '#/components/schemas/NewsStatus'
                operator_rating:
                  type: integer
                operator_notes:
                  type: string
      responses:
        '200':
          description: News item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'

  /news/{news_id}/score:
    parameters:
      - name: news_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - News
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Scoring result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringResult'

  /reports:
    get:
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReportStatus'
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                  pages:
                    type: integer
    post:
      tags:
        - Reports
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportWithNews'

  /reports/generate:
    post:
      tags:
        - Reports
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                template_id:
                  type: string
                  format: uuid
                country_filter:
                  type: string
                language_filter:
                  type: string
                date_from:
                  type: string
                  format: date-time
                date_to:
                  type: string
                  format: date-time
                min_score:
                  type: number
                include_news_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportWithNews'

  /reports/{report_id}:
    parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Reports
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportWithNews'
    patch:
      tags:
        - Reports
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
