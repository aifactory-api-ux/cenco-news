          type: string
          format: uuid
    post:
      tags:
        - Reports
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Report approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /reports/{report_id}/reject: